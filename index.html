    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap');

        :root {
            --world-gold: #ddec0f;
            --world-gold-hover: #c4d40b;
            --world-navy: #0a192f;
            --dark-bg: #050b14;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(221, 236, 15, 0.18);

        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--dark-bg); 
            color: #ffffff; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        .heading-font { font-family: 'Outfit', sans-serif; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-panel { 
            background: var(--panel-bg); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow); 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .glass-panel:hover {
            border-color: rgba(221, 236, 15, 0.35);
            box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.5);
        }

        .score-box { 
            width: 38px; 
            height: 38px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 10px; 
            font-weight: 900; 
            font-size: 15px; 
            border: 1px solid #1e293b; 
            background: #020617; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }

        @media (min-width: 640px) {
            .score-box {
                width: 44px;
                height: 44px;
                font-size: 16px;
                border-radius: 12px;
            }
        }

        .score-input {
            width: 48px;
            height: 42px;
            background: #020617;
            border: 2px solid #334155;
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            font-weight: 900;
            color: var(--world-gold);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        @media (min-width: 640px) {
            .score-input {
                width: 52px;
                height: 44px;
                font-size: 18px;
                border-radius: 12px;
            }
        }
        .score-input:focus {
            border-color: var(--world-gold);
            box-shadow: 0 0 10px rgba(221, 236, 15, 0.3);
        }

        .group-header { 
            background: linear-gradient(90deg, rgba(221,236,15,0.12) 0%, rgba(221,236,15,0) 100%); 
            border-left: 4px solid var(--world-gold); 
        }

        .team-link { 
            color: #ffffff !important; 
            text-decoration: none; 
            transition: color 0.2s ease, opacity 0.2s ease; 
        }
        .team-link:hover { 
            color: var(--world-gold) !important; 
            opacity: 0.9;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBULCL5Oj4k6wC0If5SNDKU9Qy0HdaqVS8",
        authDomain: "masterleague-8ebbb.firebaseapp.com",
        projectId: "masterleague-8ebbb",
        storageBucket: "masterleague-8ebbb.firebasestorage.app",
        messagingSenderId: "81387077466",
        appId: "1:81387077466:web:7605cb7b6fdb6ba499bd63",
        measurementId: "G-2HZQXFJWJD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    function updateCloudBadge(status, message) {
        const badge = document.getElementById('cloud-status-badge');
        if (!badge) return;

        if (status === 'connected') {
            badge.className = "px-2 py-0.5 rounded-full text-[8px] sm:text-[9px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 flex items-center gap-1";
            badge.innerHTML = `<i class="fas fa-cloud text-emerald-400"></i> Cloud Live`;
        } else if (status === 'restricted') {
            badge.className = "px-2 py-0.5 rounded-full text-[8px] sm:text-[9px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30 flex items-center gap-1";
            badge.innerHTML = `<i class="fas fa-exclamation-triangle text-rose-400"></i> Fallback (${message || 'Locked'})`;
        } else {
            badge.className = "px-2 py-0.5 rounded-full text-[8px] sm:text-[9px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30 flex items-center gap-1";
            badge.innerHTML = `<i class="fas fa-circle-notch animate-spin text-[7px]"></i> Connecting...`;
        }
    }

    signInAnonymously(auth).catch(err => {
        console.warn("Firebase Auth Note:", err.message);
        updateCloudBadge('restricted', 'Auth Blocked');
    });

    onAuthStateChanged(auth, user => {
        currentUser = user;
    });

    window.CloudDataService = {
        saveResultToCloud: async (matchId, payload) => {
            const matchIdStr = String(matchId);
            let cloudSaved = false;
            let cloudErrorMsg = "";

            try {
                await setDoc(doc(db, "matchResults", matchIdStr), payload);
                cloudSaved = true;
                updateCloudBadge('connected');
            } catch (err) {
                console.error("Firestore Write Failed:", err);
                cloudErrorMsg = err.code || err.message;
                updateCloudBadge('restricted', 'Restricted');
            }
            return { cloudSaved, cloudErrorMsg };
        },

        deleteResultFromCloud: async (matchId) => {
            const matchIdStr = String(matchId);
            let cloudDeleted = false;
            try {
                await deleteDoc(doc(db, "matchResults", matchIdStr));
                cloudDeleted = true;
            } catch (err) {
                console.error("Firestore Delete Failed:", err);
            }
            return { cloudDeleted };
        },

        subscribeToCloud: (callback) => {
            let unsubscribeFS = () => {};
            try {
                unsubscribeFS = onSnapshot(collection(db, "matchResults"), (snapshot) => {
                    const liveResults = {};
                    snapshot.forEach(docSnap => {
                        liveResults[docSnap.id] = docSnap.data();
                    });
                    callback(liveResults);
                    updateCloudBadge('connected');
                }, (err) => {
                    console.warn("Firestore subscription restricted:", err.message);
                    updateCloudBadge('restricted', 'Denied');
                });
            } catch (err) {
                console.warn("Firestore listener error:", err.message);
                updateCloudBadge('restricted', 'Offline');
            }
            return unsubscribeFS;
        }
    };
</script>

        "Cape Verde": "https://t.me/a_saw_chan",
        "Saudi Arabia": "https://t.me/Sakmkl",
        "Spain": "https://t.me/Shinelay12390",
        "Uruguay": "https://t.me/bobominhein"
    };

    const PLAYER_NAMES = [
        "Czech Republic", "Mexico", "South Africa", "South Korea",
        "Bosnia and Herzegovina", "Canada", "Qatar", "Switzerland",
        "Brazil", "Haiti", "Morocco", "Scotland",
        "Australia", "Paraguay", "Turkey", "USA",
        "Curaçao", "Ecuador", "Germany", "Ivory Coast",
        "Japan", "Netherlands", "Sweden", "Tunisia",
        "Belgium", "Egypt", "Iran", "New Zealand",
        "Cape Verde", "Saudi Arabia", "Spain", "Uruguay"
    ];

    const GROUPS = "ABCDEFGH".split("");

    const TEAMS = Object.freeze(PLAYER_NAMES.map((name, index) => {
        const groupIndex = Math.floor(index / 4);
        return Object.freeze({
            id: index + 1,
            name: name,
            group: GROUPS[groupIndex] || "H",
            link: TELEGRAM_LINKS[name] || "#"
        });
    }));

    const rawFixtures = [];
    let matchCounter = 1;

    GROUPS.forEach(group => {
        const groupTeams = TEAMS.filter(t => t.group === group);
        const pairings = [
            { h: 0, a: 1, round: 1 },
            { h: 2, a: 3, round: 1 },
            { h: 0, a: 2, round: 2 },
            { h: 1, a: 3, round: 2 },
            { h: 0, a: 3, round: 3 },
            { h: 1, a: 2, round: 3 }
        ];

        pairings.forEach(p => {
            rawFixtures.push(Object.freeze({
                id: matchCounter++,
                stage: "GROUP",
                group: group,
                round: p.round,
                home: groupTeams[p.h].name,
                away: groupTeams[p.a].name
            }));
        });
    });

    const GROUP_FIXTURES = Object.freeze(rawFixtures);

    const LOCAL_STORAGE_KEY = "master_league_32_results_v1";
    let matchResults = {};
    let activeTab = "public";
    let activePublicStage = "group";
    let activeGroupRound = 1;
    let isAdminUnlocked = false;

    function loadLocalResults() {
        try {
            const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
            matchResults = stored ? JSON.parse(stored) : {};
        } catch (e) {
            console.error("Error reading storage:", e);
            matchResults = {};
        }
    }

    function saveLocalResults() {
        try {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(matchResults));
        } catch (e) {
            console.error("Error writing storage:", e);
        }
    }

    function calculateStandings(teams, fixtures, resultsMap) {
        const standingsMap = {};
        teams.forEach(t => {
            standingsMap[t.name] = {
                id: t.id,
                name: t.name,
                group: t.group,
                link: t.link,
                m: 0, w: 0, d: 0, l: 0,
                gf: 0, ga: 0, gd: 0, pts: 0
            };
        });

        fixtures.forEach(fixture => {
            const result = resultsMap[fixture.id];
            if (result && result.status === "finished" && result.homeScore !== null && result.awayScore !== null) {
                const home = standingsMap[fixture.home];
                const away = standingsMap[fixture.away];

                if (home && away) {
                    const hS = Number(result.homeScore);
                    const aS = Number(result.awayScore);

                    home.m++; away.m++;
                    home.gf += hS; home.ga += aS;
                    away.gf += aS; away.ga += hS;

                    if (hS > aS) {
                        home.w++; home.pts += 3; away.l++;
                    } else if (hS < aS) {
                        away.w++; away.pts += 3; home.l++;
                    } else {
                        home.d++; away.d++; home.pts += 1; away.pts += 1;
                    }

                    home.gd = home.gf - home.ga;
                    away.gd = away.gf - away.ga;
                }
            }
        });

        const groupStandings = {};
        GROUPS.forEach(g => {
            const groupTeams = Object.values(standingsMap).filter(t => t.group === g);
            groupTeams.sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.gd !== a.gd) return b.gd - a.gd;
                return b.gf - a.gf;
            });
            groupStandings[g] = groupTeams;
        });

        return groupStandings;
    }

    function isGroupStageComplete(resultsMap) {
        for (let i = 1; i <= 48; i++) {
            const res = resultsMap[i];
            if (!res || res.status !== "finished") return false;
        }
        return true;
    }

    function getQualifiedTeamsData(resultsMap) {
        const groupStandings = calculateStandings(TEAMS, GROUP_FIXTURES, resultsMap);
        const winners = {};
        const runnersUp = {};
        
        GROUPS.forEach(g => {
            const list = groupStandings[g];
            if (list && list.length >= 2) {
                winners[g] = { ...list[0], group: g, position: 1 };
                runnersUp[g] = { ...list[1], group: g, position: 2 };
            }
        });

        return {
            groupStandings,
            winners,
            runnersUp,
            isComplete: isGroupStageComplete(resultsMap)
        };
    }

    function generateRoundOf16Fixtures(qualifiedData) {
        const { winners, runnersUp } = qualifiedData;

        // Traditional 2018 World Cup Matchups
        const matchups = [
            { id: 49, hGroup: 'A', hPos: '1', aGroup: 'B', aPos: '2' }, // 1A vs 2B
            { id: 50, hGroup: 'C', hPos: '1', aGroup: 'D', aPos: '2' }, // 1C vs 2D
            { id: 51, hGroup: 'E', hPos: '1', aGroup: 'F', aPos: '2' }, // 1E vs 2F
            { id: 52, hGroup: 'G', hPos: '1', aGroup: 'H', aPos: '2' }, // 1G vs 2H
            { id: 53, hGroup: 'B', hPos: '1', aGroup: 'A', aPos: '2' }, // 1B vs 2A
            { id: 54, hGroup: 'D', hPos: '1', aGroup: 'C', aPos: '2' }, // 1D vs 2C
            { id: 55, hGroup: 'F', hPos: '1', aGroup: 'E', aPos: '2' }, // 1F vs 2E
            { id: 56, hGroup: 'H', hPos: '1', aGroup: 'G', aPos: '2' }  // 1H vs 2G
        ];

        return matchups.map((m, i) => {
            const homeTeam = winners[m.hGroup]?.name || `Winner Grp ${m.hGroup}`;
            const awayTeam = runnersUp[m.aGroup]?.name || `Runner-Up Grp ${m.aGroup}`;

            return {
                id: m.id,
                stage: "R16",
                matchNumber: i + 1,
                home: homeTeam,
                away: awayTeam,
                nextMatchId: 57 + Math.floor(i / 2)
            };
        });
    }

    function generateQuarterFinalsFixtures(r16Results) {
        const matches = [];
        for (let i = 0; i < 4; i++) {
            const m1Id = 49 + (i * 2);
            const m2Id = 50 + (i * 2);
            
            const w1 = r16Results[m1Id]?.winnerName || `Winner R16 #${(i*2)+1}`;
            const w2 = r16Results[m2Id]?.winnerName || `Winner R16 #${(i*2)+2}`;

            matches.push({
                id: 57 + i,
                stage: "QF",
                matchNumber: i + 1,
                home: w1,
                away: w2,
                nextMatchId: 61 + Math.floor(i / 2)
            });
        }
        return matches;
    }

    function generateSemiFinalsFixtures(qfResults) {
        const matches = [];
        for (let i = 0; i < 2; i++) {
            const m1Id = 57 + (i * 2);
            const m2Id = 58 + (i * 2);
            
            const w1 = qfResults[m1Id]?.winnerName || `Winner QF #${(i*2)+1}`;
            const w2 = qfResults[m2Id]?.winnerName || `Winner QF #${(i*2)+2}`;

            matches.push({
                id: 61 + i,
                stage: "SF",
                matchNumber: i + 1,
                home: w1,
                away: w2,
                nextMatchId: i === 0 ? 63 : 64
            });
        }
        return matches;
    }

    function generateThirdAndFinalFixtures(sfResults) {
        const sf1Res = sfResults[61];
        const sf2Res = sfResults[62];

        const w1 = sf1Res?.winnerName || "Winner SF #1";
        const w2 = sf2Res?.winnerName || "Winner SF #2";
        const l1 = sf1Res?.loserName || "Loser SF #1";
        const l2 = sf2Res?.loserName || "Loser SF #2";

        return [
            {
                id: 63,
                stage: "THIRD",
                matchNumber: 1,
                home: l1,
                away: l2,
                nextMatchId: null
            },
            {
                id: 64,
                stage: "FINAL",
                matchNumber: 1,
                home: w1,
                away: w2,
                nextMatchId: null
            }
        ];
    }

    function getAllTournamentFixtures(resultsMap) {
        const qData = getQualifiedTeamsData(resultsMap);
        const r16 = generateRoundOf16Fixtures(qData);
        
        const r16Res = {};
        r16.forEach(m => { if(resultsMap[m.id]) r16Res[m.id] = resultsMap[m.id]; });
        const qf = generateQuarterFinalsFixtures(r16Res);

        const qfRes = {};
        qf.forEach(m => { if(resultsMap[m.id]) qfRes[m.id] = resultsMap[m.id]; });
        const sf = generateSemiFinalsFixtures(qfRes);

        const sfRes = {};
        sf.forEach(m => { if(resultsMap[m.id]) sfRes[m.id] = resultsMap[m.id]; });
        const finalsArr = generateThirdAndFinalFixtures(sfRes);

        return {
            R16: r16,
            QF: qf,
            SF: sf,
            THIRD: [finalsArr[0]],
            FINAL: [finalsArr[1]]
        };
    }

                            const res = matchResults[m.id] || {};
                            return `<div class="glass-panel border-2 border-[var(--world-gold)]/50 p-4 rounded-2xl text-xs space-y-2 bg-[var(--world-gold)]/5">
                                <div class="flex justify-between font-black ${res.winner === 'home' ? 'text-[var(--world-gold)]' : 'text-white'}"><span class="truncate pr-2">${m.home}</span><span>${res.homeScore ?? '-'}</span></div>
                                <div class="flex justify-between font-black ${res.winner === 'away' ? 'text-[var(--world-gold)]' : 'text-white'}"><span class="truncate pr-2">${m.away}</span><span>${res.awayScore ?? '-'}</span></div>
                            </div>`;
                        }).join('')}
                    </div>
                    <div>
                        <div class="text-[10px] font-black uppercase text-zinc-400 tracking-widest mb-2">Third-Place Match</div>
                        ${allFixtures.THIRD.map(m => {
                            const res = matchResults[m.id] || {};
                            return `<div class="bg-black/60 border border-zinc-800 p-3 rounded-2xl text-xs space-y-1">
                                <div class="flex justify-between font-bold ${res.winner === 'home' ? 'text-emerald-400' : 'text-zinc-300'}"><span class="truncate pr-2">${m.home}</span><span>${res.homeScore ?? '-'}</span></div>
                                <div class="flex justify-between font-bold ${res.winner === 'away' ? 'text-emerald-400' : 'text-zinc-300'}"><span class="truncate pr-2">${m.away}</span><span>${res.awayScore ?? '-'}</span></div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            </div>
        </div>`;
    }

    function renderPublicTournamentStatus(container) {
        let completedCount = 0;
        let totalMatches = 64;
        for (let i = 1; i <= 64; i++) {
            if (matchResults[i] && matchResults[i].status === "finished") completedCount++;
        }

        const finalRes = matchResults[64];
        const champion = finalRes && finalRes.status === "finished" ? finalRes.winnerName : "Not Decided";

        container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
            <div class="glass-panel p-5 sm:p-6 rounded-3xl space-y-2">
                <span class="text-[10px] font-black uppercase tracking-widest text-zinc-500">Current Stage</span>
                <h3 class="heading-font text-xl sm:text-2xl font-black text-[var(--world-gold)]">${completedCount === 64 ? 'CHAMPION CROWNED' : completedCount >= 60 ? 'FINAL STAGE' : completedCount >= 48 ? 'ROUND OF 16' : 'GROUP STAGE'}</h3>
            </div>
            <div class="glass-panel p-5 sm:p-6 rounded-3xl space-y-2">
                <span class="text-[10px] font-black uppercase tracking-widest text-zinc-500">Matches Completed</span>
                <h3 class="heading-font text-xl sm:text-2xl font-black text-white">${completedCount} / ${totalMatches}</h3>
            </div>
            <div class="glass-panel p-5 sm:p-6 rounded-3xl space-y-2">
                <span class="text-[10px] font-black uppercase tracking-widest text-zinc-500">World Cup Champion</span>
                <h3 class="heading-font text-xl sm:text-2xl font-black text-emerald-400 truncate">${champion}</h3>
            </div>
        </div>`;
    }

    window.renderAdminMatches = function() {
        const stageFilter = document.getElementById('admin-stage-select').value;
        const groupFilter = document.getElementById('admin-group-select').value;
        const statusFilter = document.getElementById('admin-status-select').value;
        const search = document.getElementById('admin-search').value.toLowerCase().trim();

        let fixturesList = [];
        if (stageFilter === "ALL" || stageFilter.startsWith("GROUP")) {
            const roundNum = stageFilter === "GROUP_R1" ? 1 : stageFilter === "GROUP_R2" ? 2 : stageFilter === "GROUP_R3" ? 3 : null;
            GROUP_FIXTURES.forEach(m => {
                if (roundNum && m.round !== roundNum) return;
                if (groupFilter !== "ALL" && m.group !== groupFilter) return;
                fixturesList.push(m);
            });
        }

        const allKnockout = getAllTournamentFixtures(matchResults);
        ['R16', 'QF', 'SF', 'THIRD', 'FINAL'].forEach(sKey => {
            if (stageFilter === "ALL" || stageFilter === sKey) {
                allKnockout[sKey].forEach(m => fixturesList.push(m));
            }
        });

        if (statusFilter !== "ALL") {
            fixturesList = fixturesList.filter(m => {
                const res = matchResults[m.id];
                const st = res && res.status === "finished" ? "finished" : "pending";
                return st === statusFilter;
            });
        }

        if (search) {
            fixturesList = fixturesList.filter(m => `${m.home} ${m.away} ${m.id} ${m.stage || 'GROUP'}`.toLowerCase().includes(search));
        }

        const container = document.getElementById('admin-matches-container');
        if (!container) return;

        if (fixturesList.length === 0) {
            container.innerHTML = `<div class="col-span-full py-12 text-center text-zinc-500 text-xs font-bold uppercase tracking-widest glass-panel rounded-3xl">No matching fixtures found</div>`;
            return;
        }

        container.innerHTML = fixturesList.map(m => {
            const res = matchResults[m.id] || { homeScore: "", awayScore: "", homePenalties: "", awayPenalties: "", status: "pending" };
            const isFinished = res.status === "finished";
            const isKnockout = m.stage && m.stage !== "GROUP";

            return `
            <div class="glass-panel rounded-3xl p-4 sm:p-5 flex flex-col justify-between space-y-4">
                <div class="flex items-center justify-between text-[11px] font-black tracking-widest text-zinc-400">
                    <span class="text-[var(--world-gold)] truncate pr-2">${m.stage === 'GROUP' ? `GRP ${m.group} • R${m.round}` : `${m.stage} • #${m.matchNumber || m.id}`}</span>
                    <span class="bg-black border border-zinc-800 px-2 py-0.5 rounded-full text-[10px] font-mono shrink-0">ID: ${m.id}</span>
                </div>

                <div class="flex items-center justify-between gap-2 text-center py-1">
                    <div class="flex-1 font-black text-xs sm:text-sm text-white truncate" title="${m.home}">${m.home}</div>
                    <span class="text-zinc-600 font-black text-xs shrink-0">VS</span>
                    <div class="flex-1 font-black text-xs sm:text-sm text-white truncate" title="${m.away}">${m.away}</div>
                </div>

                <div class="flex flex-col space-y-2 bg-black/60 p-3 rounded-2xl border border-zinc-800">
                    <div class="flex items-center justify-center space-x-3 sm:space-x-4">
                        <div class="flex flex-col items-center">
                            <span class="text-[9px] font-black uppercase text-zinc-500 mb-1">HOME</span>
                            <input type="number" min="0" id="score-h-${m.id}" value="${res.homeScore ?? ''}" class="score-input" placeholder="-">
                        </div>
                        <span class="text-zinc-600 font-bold text-lg mt-4">:</span>
                        <div class="flex flex-col items-center">
                            <span class="text-[9px] font-black uppercase text-zinc-500 mb-1">AWAY</span>
                            <input type="number" min="0" id="score-a-${m.id}" value="${res.awayScore ?? ''}" class="score-input" placeholder="-">
                        </div>
                    </div>
                    ${isKnockout ? `
                    <div class="flex items-center justify-center space-x-3 pt-2 border-t border-white/5 text-[10px]">
                        <div class="flex items-center gap-1">
                            <span>Pen H:</span>
                            <input type="number" min="0" id="pen-h-${m.id}" value="${res.homePenalties ?? ''}" class="w-11 h-8 bg-black border border-zinc-700 text-center rounded text-xs font-bold text-[var(--world-gold)]">
                        </div>
                        <div class="flex items-center gap-1">
                            <span>Pen A:</span>
                            <input type="number" min="0" id="pen-a-${m.id}" value="${res.awayPenalties ?? ''}" class="w-11 h-8 bg-black border border-zinc-700 text-center rounded text-xs font-bold text-[var(--world-gold)]">
                        </div>
                    </div>` : ''}
                </div>

                <div class="flex items-center justify-between pt-1">
                    <span class="px-2.5 py-1 rounded-lg font-bold uppercase text-[9px] ${isFinished ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">
                        ${res.status.toUpperCase()}
                    </span>
                    <div class="flex space-x-2">
                        ${isFinished ? `<button onclick="clearMatchResult(${m.id})" class="px-3 py-2 rounded-xl text-xs font-bold bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800/50 transition">Reset</button>` : ''}
                        <button onclick="saveMatchResult(${m.id}, ${isKnockout})" class="px-4 py-2 rounded-xl text-xs font-black uppercase bg-[var(--world-gold)] text-black hover:bg-[var(--world-gold-hover)] shadow-md transition">Save</button>
                    </div>
                </div>
            </div>`;
        }).join('');
    };

    window.handleLogin = function() {
        const pass = document.getElementById('admin-passcode').value.trim();
        if (pass === "2024") {
            isAdminUnlocked = true;
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('admin-panel-content').classList.remove('hidden');
            renderAdminMatches();
            showToast("Admin portal unlocked successfully!");
        } else {
            showToast("Password မှားယွင်းနေပါသည်။", true);
        }
    };

    window.saveMatchResult = async function(matchId, isKnockout) {
        const numericMatchId = Number(matchId);

        const allFixtures = getAllTournamentFixtures(matchResults);
        const fixture = Object.values(allFixtures)
            .flat()
            .find(f => Number(f.id) === numericMatchId) || GROUP_FIXTURES.find(f => Number(f.id) === numericMatchId);

        if (!fixture) {
            showToast(`Match #${numericMatchId} fixture not found.`, true);
            return;
        }

        const homeTeam = fixture.home;
        const awayTeam = fixture.away;

        const hEl = document.getElementById(`score-h-${numericMatchId}`);
        const aEl = document.getElementById(`score-a-${numericMatchId}`);

        if (!hEl || !aEl) {
            showToast(`Match #${numericMatchId} score inputs not found.`, true);
            return;
        }

        const hInput = hEl.value.trim();
        const aInput = aEl.value.trim();

        if (hInput === "" || aInput === "") {
            showToast("Please enter both home & away scores.", true);
            return;
        }

        const hScore = Number(hInput);
        const aScore = Number(aInput);

        if (homeTeam === awayTeam) {
            showToast("A team cannot play against itself!", true);
            return;
        }

        let winner = null;
        let loser = null;
        let winnerName = null;
        let loserName = null;
        let hPen = null;
        let aPen = null;

        if (hScore > aScore) {
            winner = 'home'; loser = 'away';
            winnerName = homeTeam; loserName = awayTeam;
        } else if (aScore > hScore) {
            winner = 'away'; loser = 'home';
            winnerName = awayTeam; loserName = homeTeam;
        } else {
            if (isKnockout) {
                const penHInput = document.getElementById(`pen-h-${numericMatchId}`)?.value;
                const penAInput = document.getElementById(`pen-a-${numericMatchId}`)?.value;
                if (penHInput === "" || penAInput === "" || penHInput === penAInput) {
                    showToast("Scores are tied! Penalty shootout winners required.", true);
                    return;
                }
                hPen = Number(penHInput);
                aPen = Number(penAInput);
                if (hPen > aPen) {
                    winner = 'home'; loser = 'away';
                    winnerName = homeTeam; loserName = awayTeam;
                } else {
                    winner = 'away'; loser = 'home';
                    winnerName = awayTeam; loserName = homeTeam;
                }
            } else {
                winner = 'draw';
            }
        }

        const payload = {
            matchId: numericMatchId,
            homeScore: hScore,
            awayScore: aScore,
            homePenalties: hPen,
            awayPenalties: aPen,
            winner,
            loser,
            winnerName,
            loserName,
            status: "finished",
            updatedAt: new Date().toISOString()
        };

        matchResults[numericMatchId] = payload;
        saveLocalResults();

        if (window.CloudDataService) {
            const cloudResult = await window.CloudDataService.saveResultToCloud(numericMatchId, payload);
            if (cloudResult && !cloudResult.cloudSaved) {
                showToast(`Match #${numericMatchId} saved locally, but cloud save failed.`, true);
            } else {
                showToast(`Match #${numericMatchId} result saved successfully!`);
            }
        } else {
            showToast(`Match #${numericMatchId} result saved successfully!`);
        }
        renderAdminMatches();
        renderPublicView();
    };

    window.clearMatchResult = async function(matchId) {
        delete matchResults[matchId];
        saveLocalResults();
        if (window.CloudDataService) {
            await window.CloudDataService.deleteResultFromCloud(matchId);
        }
        showToast(`Match #${matchId} reset.`);
        renderAdminMatches();
        renderPublicView();
    };

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        const toastIcon = document.getElementById('toast-icon');
        if (!toast) return;

        toastMsg.innerText = msg;
        toastIcon.className = isError ? "fas fa-exclamation-triangle text-rose-500 text-lg shrink-0" : "fas fa-check-circle text-[var(--world-gold)] text-lg shrink-0";
        toast.style.borderColor = isError ? "#f43f5e" : "#ddec0f";

        toast.classList.remove('translate-y-12', 'opacity-0', 'pointer-events-none');
        setTimeout(() => {
            toast.classList.add('translate-y-12', 'opacity-0', 'pointer-events-none');
        }, 3000);
    }

    window.onload = () => {
        loadLocalResults();

        const pubGroupSelect = document.getElementById('pub-group-select');
        const adminGroupSelect = document.getElementById('admin-group-select');
        if (pubGroupSelect && adminGroupSelect) {
            GROUPS.forEach(g => {
                const opt1 = document.createElement('option');
                opt1.value = g; opt1.innerText = `Group ${g}`;
                pubGroupSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = g; opt2.innerText = `Group ${g}`;
                adminGroupSelect.appendChild(opt2);
            });
        }

        if (window.CloudDataService) {
            window.CloudDataService.subscribeToCloud(liveResults => {
                matchResults = { ...matchResults, ...liveResults };
                saveLocalResults();
                if (activeTab === 'public') renderPublicView();
                else if (isAdminUnlocked) renderAdminMatches();
            });
        }

        renderPublicView();
    };
</script>
</body>
</html>
